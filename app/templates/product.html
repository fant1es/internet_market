{% extends "base.html" %}

{% block title %}{{ t('product.title') }}{% endblock %}

{% block content %}
  <a href="/" class="btn btn-link px-0 mb-3">{{ t('product.back') }}</a>

  {# Обновление тегов в js будет #}
  <div id="product" data-id="{{ product_id }}">
    <div class="text-muted">{{ t('common.loading') }}</div>
  </div>

  {# Содержимое рисует reviews.js #}
  <section id="reviews" class="mt-5"
           data-product-id="{{ product_id }}"
           data-user-id="{{ user.id if user else '' }}"
           data-is-admin="{{ 'true' if user and user.role.value == 'admin' else 'false' }}"></section>
{% endblock %}

{% block scripts %}
  <script src="/static/js/product.js"></script>
  <script src="/static/js/reviews.js"></script>
{% endblock %}
