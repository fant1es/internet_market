<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Магазин{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand bg-light px-3">
  <a class="navbar-brand" href="/">Магазин</a>
  <div class="ms-auto d-flex align-items-center gap-2">
    {% if user %}
      <a href="/my-cart" class="btn btn-outline-primary btn-sm">
        Корзина <span id="cart-count" class="badge bg-secondary">0</span>
      </a>
      <span>Привет, {{ user.name }}</span>
      <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Выйти</button>
    {% else %}
      <a href="/login" class="btn btn-primary btn-sm">Войти</a>
    {% endif %}
  </div>
</nav>

<div id="alerts" class="container mt-3"></div>
<main class="container my-4">{% block content %}{% endblock %}</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/base.js"></script>
<script src="/static/js/cart.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
