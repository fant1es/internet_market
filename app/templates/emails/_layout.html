<!doctype html>
<html lang="ru">
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#212529;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:32px;font-size:15px;line-height:1.5;">
              <div style="font-size:20px;font-weight:bold;margin-bottom:20px;">{{ shop_name }}</div>
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="font-size:12px;color:#6c757d;margin:16px 0 0;">
          Это автоматическое письмо, отвечать на него не нужно.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
