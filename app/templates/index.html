{% extends "base.html" %}

{% block title %}Каталог{% endblock %}

{% block content %}
  <h1 class="mb-4">Каталог</h1>

  <div class="row g-2 mb-4">
    <div class="col-md-8">
      <input type="search" id="search-input" class="form-control" placeholder="Поиск по названию...">
    </div>
    <div class="col-md-4">
      <select id="category-select" class="form-select">
        <option value="">Все категории</option>
      </select>
    </div>
    <div class="row g-2 mb-4">
      <div class="col-6 col-md-2">
        <input type="number" id="min-price" class="form-control" placeholder="Цена от" min="0" step="0.01">
      </div>
      <div class="col-6 col-md-2">
        <input type="number" id="max-price" class="form-control" placeholder="Цена до" min="0" step="0.01">
      </div>
      <div class="col-md-5">
        <select id="sort-select" class="form-select">
          <option value="newest">Сначала новые</option>
          <option value="price_asc">Сначала дешёвые</option>
          <option value="price_desc">Сначала дорогие</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="button" id="reset-filters" class="btn btn-outline-secondary w-100">Сбросить</button>
      </div>
    </div>
  </div>

  <div id="products-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>

  <nav id="pagination" class="mt-4"></nav>
{% endblock %}

{% block scripts %}
  <script src="/static/js/catalog.js"></script>
{% endblock %}
