{% extends "base.html" %}
{% block head %}
  <link rel="stylesheet" href="../static/css/catalog.css">
{% endblock %}
{% block title %}Каталог{% endblock %}

{% block content %}
  <h1 class="mb-4">Каталог</h1>

  <!-- Сверху только поиск и категория: от категории зависят все фильтры слева -->
  <div class="row g-2 mb-3">
    <div class="col-md-8">
      <input type="search" id="search-input" class="form-control" placeholder="Поиск по названию...">
    </div>
    <div class="col-md-4">
      <select id="category-select" class="form-select">
        <option value="">Все категории</option>
      </select>
    </div>
  </div>

  <div class="row g-3">
    <aside class="col-lg-3 align-self-start filters-sticky">
      <!-- На узких экранах панель сворачивается под кнопку, на широких всегда открыта -->
      <button class="btn btn-outline-secondary w-100 d-lg-none mb-2" type="button"
              data-bs-toggle="collapse" data-bs-target="#filters-panel"
              aria-expanded="false" aria-controls="filters-panel">Фильтры</button>

      <div id="filters-panel" class="collapse d-lg-block">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Фильтры</h6>
          <button type="button" id="reset-filters" class="btn btn-link btn-sm p-0">Сбросить</button>
        </div>

        <div class="filter-block">
          <label for="sort-select" class="form-label small text-muted mb-1">Сортировка</label>
          <select id="sort-select" class="form-select form-select-sm">
            <option value="newest">Сначала новые</option>
            <option value="price_asc">Сначала дешёвые</option>
            <option value="price_desc">Сначала дорогие</option>
          </select>
        </div>

        <details class="filter-group" open>
          <summary>Цена</summary>
          <div class="pb-3">
            <div id="price-label" class="small text-muted mb-1"></div>
            <div class="range-dual mb-2">
              <div class="range-track"></div>
              <div class="range-fill" id="range-fill"></div>
              <input type="range" id="range-min">
              <input type="range" id="range-max">
            </div>
            <div class="row g-2">
              <div class="col-6">
                <input type="number" id="min-price" class="form-control form-control-sm"
                       placeholder="от" min="0" step="0.01">
              </div>
              <div class="col-6">
                <input type="number" id="max-price" class="form-control form-control-sm"
                       placeholder="до" min="0" step="0.01">
              </div>
            </div>
          </div>
        </details>

        <div class="filter-block">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="discount-only">
            <label class="form-check-label" for="discount-only">Только со скидкой</label>
          </div>
        </div>

        <details class="filter-group" open>
          <summary>Бренд</summary>
          <div id="brands-box" class="filter-scroll pb-2"></div>
        </details>

        <!-- Характеристики выбранной категории (группы <details> рисует catalog.js) -->
        <div id="filters-box"></div>
      </div>
    </aside>

    <section class="col-12 col-lg-9">
      <div id="products-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-3"></div>
      <nav id="pagination" class="mt-4"></nav>
    </section>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/js/catalog.js"></script>
{% endblock %}
