{% extends "base.html" %}

{% block title %}{{ t('auth.login_title') }}{% endblock %}

{% block content %}
  <div class="col-md-5 col-lg-4 mx-auto">
    <h1 class="mb-4">{{ t('auth.login_title') }}</h1>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">{{ t('auth.email') }}</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">{{ t('auth.password') }}</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">{{ t('auth.login_submit') }}</button>
    </form>

    <p class="mt-3 text-center">
      {{ t('auth.no_account') }} <a href="/register">{{ t('auth.register_link') }}</a>
    </p>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/js/auth.js"></script>
{% endblock %}
