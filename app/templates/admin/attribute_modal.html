{# Окно управления характеристиками категории для подключения вне любых <form>, ибо внутри свои формы #}
<div class="modal fade" id="attr-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="attr-modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ t('common.close') }}"></button>
      </div>

      <div class="modal-body">
        <div id="attr-modal-error" class="alert alert-danger d-none"></div>
        <div id="attr-list"></div>
      </div>

      <div class="modal-footer">
        <form id="attr-add-form" class="input-group" novalidate>
          <input type="text" id="attr-new-name" class="form-control" maxlength="100" required
                 placeholder="{{ t('admin.attr_placeholder') }}">
          <button type="submit" class="btn btn-primary">{{ t('admin.attr_add') }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
